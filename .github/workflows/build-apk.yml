name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - registry-studio/v1
      - registry-studio/clean-rebuild
    paths-ignore:
      - 'worker/registry_apply/**'
      - '.github/workflows/registry-apply-worker.yml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create env file
        run: |
          cat > .env <<'ENVEOF'
          TYPHOON_API_KEY=${{ secrets.TYPHOON_API_KEY }}
          TYPHOON_BASE_URL=https://api.opentyphoon.ai/v1
          TYPHOON_MODEL=typhoon-v2.5-30b-a3b-instruct
          ENVEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Download pinned Registry snapshot
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "$RUNNER_TEMP/Helpy_Architecture_Registry_v1.md" \
            "https://raw.githubusercontent.com/srs2800302-collab/helpy/8e26a1eed581f96aa57f4b400dd4b6d59c30168f/docs/architecture/Helpy_Architecture_Registry_v1.md"
          test -s "$RUNNER_TEMP/Helpy_Architecture_Registry_v1.md"

      - name: Analyze
        run: flutter analyze

      - name: Test
        env:
          REGISTRY_STUDIO_FULL_REGISTRY_SNAPSHOT: ${{ runner.temp }}/Helpy_Architecture_Registry_v1.md
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: registry-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
