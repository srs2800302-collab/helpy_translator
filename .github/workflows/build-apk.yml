name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - registry-studio/modular-rebuild
    paths-ignore:
      - 'worker/registry_apply/**'
      - '.github/workflows/registry-apply-worker.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: registry-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
